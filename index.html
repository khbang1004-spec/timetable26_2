<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2-4 선택과목 시간표</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Cpath d='M28 35h44M28 50h44M28 65h28' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">

    <!-- 검색 화면 -->
    <section class="search-screen" id="search-screen">
      <div class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h8V4H8zm2 3h4v1.5h-4V7zm0 3h4v1.5h-4V10zm0 3h2.5v1.5H10V13z"/>
        </svg>
      </div>
      <h1>2-4 선택과목<br>시간표</h1>
      <p class="sub">번호, 이름, 학번 중 하나를 입력하세요</p>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <label for="keyword" class="sr-only">학생 검색</label>
        <input id="keyword" type="search"
          placeholder="여기에 입력하세요" autocomplete="off" enterkeyhint="search" />
        <div id="dropdown" class="dropdown" hidden></div>
      </div>

      <p id="msg" class="msg" aria-live="polite"></p>
      <p class="page-footer">© 2026 천안불당고 2학년 4반</p>
    </section>

    <!-- 시간표 결과 -->
    <section class="result" id="result" aria-live="polite">
      <button class="back-btn" id="back-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        다른 학생 보기
      </button>

      <div class="result-head">
        <p class="eyebrow">TIME TABLE</p>
        <div class="title-row">
          <h2 id="result-name"></h2>
          <span class="badge">2학년 4반</span>
        </div>
        <p class="meta" id="result-meta"></p>
      </div>

      <div class="table-scroll">
        <table class="timetable" id="timetable">
          <thead>
            <tr>
              <th>교시</th>
              <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
            </tr>
          </thead>
          <tbody id="timetable-body"></tbody>
        </table>
      </div>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
